name: "SCSE Web"

trigger:
  batch: true
  # branches:
  #   include:
  #     - main
  tags:
    include:
      - "*"

parameters:
  - name: useSelfHosted
    displayName: "Use Self-Hosted Agent (Raosan)"
    type: boolean
    default: false

variables:
  - group: scse-openvpn
  - group: scse-wireguard-smdv
  - name: CI
    value: true

stages:
  - stage: BuildTest
    displayName: Build and test
    jobs:
      - job: build_and_test
        displayName: Build and Test
        condition: always()
        timeoutInMinutes: "30"
        pool:
          ${{ if eq(parameters.useSelfHosted, true) }}:
            name: Raosan
          ${{ else }}:
            vmImage: ubuntu-latest

        steps:
          - task: Npm@1
            displayName: Install Bun
            inputs:
              command: "custom"
              customCommand: "install -g bun"
              verbose: true

          - script: bun install
            displayName: "Install dependencies"

          - script: bun run lint
            displayName: "Run Static Code Analysis"

          - script: bun run test
            displayName: "Test the application"

          - task: Cache@2
            displayName: "Cache Next.js build"
            inputs:
              key: 'next | "$(Agent.OS)" | bun.lock'
              restoreKeys: |
                next | "$(Agent.OS)"
              path: $(System.DefaultWorkingDirectory)/.next/cache

          - script: bun run build
            displayName: "Build the application"


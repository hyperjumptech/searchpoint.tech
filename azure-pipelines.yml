  - stage: "ReleaseToProd"
    displayName: "Release to Production"
    dependsOn: BuildTest
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/'), not(endsWith(variables['Build.SourceBranch'], '-smdv')), not(endsWith(variables['Build.SourceBranch'], '-sinarmas')))
    jobs:
      - job: DeployToProduction
        displayName: "Deploy to Production"
        pool:
          vmImage: ubuntu-latest
        steps:
          # TODO: Re-enable Playwright tests before production deployment
          # - task: Npm@1
          #   displayName: Install Bun
          #   inputs:
          #     command: "custom"
          #     customCommand: "install -g bun"
          #     verbose: true

          # - script: bun install
          #   displayName: "Install dependencies"

          # - script: bunx playwright install --with-deps
          #   displayName: "Install Playwright browsers"

          # - script: bun run test:e2e
          #   displayName: "Run Playwright Tests"
          #   env:
          #     CI: "true"
          #     BACKEND_BASE_URL: $(BACKEND_BASE_URL)

          # - task: PublishTestResults@2
          #   displayName: "Publish test results"
          #   inputs:
          #     searchFolder: "test-results"
          #     testResultsFormat: "JUnit"
          #     testResultsFiles: "e2e-junit-results.xml"
          #     mergeTestResults: true
          #     failTaskOnFailedTests: true
          #     testRunTitle: "SCSE Web E2E Tests"
          #   condition: succeededOrFailed()

          # - task: PublishPipelineArtifact@1
          #   displayName: "Publish Playwright report"
          #   inputs:
          #     targetPath: playwright-report
          #     artifact: playwright-report
          #     publishLocation: "pipeline"
          #   condition: succeededOrFailed()

          # Strip the 'v' prefix from the tag e.g. v1.0.0 -> 1.0.0
          # This is needed because the tag is prefixed with 'v' in the Azure Pipelines UI
          - bash: |
              TAG=$(Build.SourceBranchName)
              # Strip 'v' prefix if it exists
              VERSION_TAG=${TAG#v}
              echo "##vso[task.setvariable variable=VERSION_TAG]$VERSION_TAG"
              echo "Original tag: $TAG"
              echo "Version tag: $VERSION_TAG"
            displayName: "Prepare version tag"

          - task: DownloadSecureFile@1
            name: ovpnFile
            displayName: "Download OpenVPN Configuration"
            inputs:
              secureFile: "AzureSearchPointProd.ovpn"

          - script: |
              sudo apt-get update
              sudo apt-get install -y openvpn
            displayName: "Install OpenVPN"

          - script: |
              echo "Starting OpenVPN connection..."
              echo "$(OPENVPN_PASSWORD)" > /tmp/openvpn-auth.txt
              chmod 600 /tmp/openvpn-auth.txt
              sudo openvpn --config $(ovpnFile.secureFilePath) --daemon --log /tmp/openvpn.log --verb 4 --status /tmp/openvpn-status.log 5 --askpass /tmp/openvpn-auth.txt

              echo "Waiting for VPN connection..."
              for i in {1..60}; do
                if ip addr show tun0 > /dev/null 2>&1; then
                  echo "VPN connected successfully after $i seconds"
                  ip addr show tun0
                  echo ""
                  echo "--- OpenVPN Status ---"
                  sudo cat /tmp/openvpn-status.log 2>/dev/null || echo "Status file not available"
                  echo ""
                  echo "--- Last 30 lines of OpenVPN Log ---"
                  sudo tail -30 /tmp/openvpn.log
                  exit 0
                fi
                
                if [ $((i % 10)) -eq 0 ]; then
                  echo "Still waiting... ($i/60 seconds)"
                  if ! pgrep openvpn > /dev/null; then
                    echo "ERROR: OpenVPN process is not running"
                    echo ""
                    echo "--- Full OpenVPN Log ---"
                    sudo cat /tmp/openvpn.log
                    exit 1
                  fi
                  echo "OpenVPN process is running (PID: $(pgrep openvpn))"
                  echo "--- Last 10 lines of log ---"
                  sudo tail -10 /tmp/openvpn.log
                fi
                sleep 1
              done

              echo ""
              echo "VPN connection timed out after 60 seconds"
              echo "OpenVPN process status: $(pgrep openvpn > /dev/null && echo 'RUNNING' || echo 'NOT RUNNING')"
              echo ""
              echo "--- Full OpenVPN Log ---"
              sudo cat /tmp/openvpn.log
              exit 1
            displayName: "Connect to OpenVPN"

          # Update package.json version
          - script: |
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                pkg.version = '$(VERSION_TAG)';
                fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              "
            displayName: "Update package.json version for production"

          # Build image
          - task: Docker@2
            displayName: "Build production docker image"
            inputs:
              containerRegistry: $(container_registry)
              command: "build"
              Dockerfile: "./Dockerfile"
              repository: "scse/search-ui-web"
              arguments: $(production_build_arguments)
              tags: |
                $(VERSION_TAG)
                latest

          # Push to ACR
          - task: Docker@2
            displayName: "Push production docker image"
            inputs:
              containerRegistry: $(container_registry)
              command: "push"
              repository: "scse/search-ui-web"
              tags: |
                $(VERSION_TAG)
                latest

          # Deploy step using SSH service connection
          - task: SSH@0
            displayName: "Use SSH to connect to PoC server"
            inputs:
              sshEndpoint: "ssh_to_production_server" # Name of the service connection
              runOptions: inline
              inline: |
                sed -i "s/^FRONTEND_TAG=.*/FRONTEND_TAG=$(VERSION_TAG)/" services/frontend/.env
                cd services/frontend && docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.ports.yml up -d --remove-orphans 2>&1

          - script: |
              sudo pkill openvpn || true
              rm -f /tmp/openvpn-auth.txt
            displayName: "Disconnect OpenVPN"
            condition: always()

  - stage: "ReleaseToSMDV"
    displayName: "Release to SMDV"
    dependsOn: BuildTest
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/'), not(endsWith(variables['Build.SourceBranch'], '-sinarmas')))
    jobs:
      - job: DeployToSMDV
        displayName: "Deploy to SMDV"
        pool:
          vmImage: ubuntu-latest
        steps:
          # Strip the 'v' prefix from the tag e.g. v1.0.0-smdv -> 1.0.0-smdv
          - bash: |
              TAG=$(Build.SourceBranchName)
              VERSION_TAG=${TAG#v}
              echo "##vso[task.setvariable variable=VERSION_TAG]$VERSION_TAG"
              echo "Original tag: $TAG"
              echo "Version tag: $VERSION_TAG"
            displayName: "Prepare version tag"

          # Update package.json version
          - script: |
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                pkg.version = '$(VERSION_TAG)';
                fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              "
            displayName: "Update package.json version for SMDV"

          # Build image
          # No build arguments needed here — the app has no NEXT_PUBLIC_* vars baked at build
          # time. Per-tenant config (APP_NAME, BACKEND_BASE_URL, AUTH_BASE_URL, UPDATER_BASE_URL)
          # is supplied purely at runtime via services/frontend/.env on the SMDV host.
          - task: Docker@2
            displayName: "Build SMDV docker image"
            inputs:
              containerRegistry: $(container_registry)
              command: "build"
              Dockerfile: "./Dockerfile"
              repository: "scse/search-ui-web"
              tags: |
                $(VERSION_TAG)

          # Push to ACR
          - task: Docker@2
            displayName: "Push SMDV docker image"
            inputs:
              containerRegistry: $(container_registry)
              command: "push"
              repository: "scse/search-ui-web"
              tags: |
                $(VERSION_TAG)

          - script: |
              sudo apt-get update
              sudo apt-get install -y wireguard-tools wireguard-go python3-jinja2
            displayName: "Install WireGuard dependencies"

          - bash: |
              set -euo pipefail

              WG_WORKDIR="$(Agent.TempDirectory)/wireguard"
              mkdir -p "$WG_WORKDIR"
              umask 077

              python3 - <<'PY'
              import os
              from pathlib import Path
              from textwrap import dedent
              from jinja2 import Template

              context = {
                  "wireguard_address": os.environ["WIREGUARD_ADDRESS"],
                  "wireguard_private_key": os.environ["WIREGUARD_PRIVATE_KEY"],
                  "wireguard_dns": os.environ.get("WIREGUARD_DNS", ""),
                  "wireguard_peer_public_key": os.environ["WIREGUARD_PEER_PUBLIC_KEY"],
                  "wireguard_preshared_key": os.environ.get("WIREGUARD_PRESHARED_KEY", ""),
                  "wireguard_endpoint": os.environ["WIREGUARD_ENDPOINT"],
                  "wireguard_allowed_ips": os.environ.get("WIREGUARD_ALLOWED_IPS", "0.0.0.0/0"),
                  "wireguard_persistent_keepalive": os.environ.get("WIREGUARD_PERSISTENT_KEEPALIVE", "25"),
              }

              template = Template(dedent("""\
              [Interface]
              Address = {{ wireguard_address }}
              PrivateKey = {{ wireguard_private_key }}
              {% if wireguard_dns %}
              DNS = {{ wireguard_dns }}
              {% endif %}

              [Peer]
              PublicKey = {{ wireguard_peer_public_key }}
              {% if wireguard_preshared_key %}
              PresharedKey = {{ wireguard_preshared_key }}
              {% endif %}
              Endpoint = {{ wireguard_endpoint }}
              AllowedIPs = {{ wireguard_allowed_ips }}
              PersistentKeepalive = {{ wireguard_persistent_keepalive }}
              """))
              rendered = template.render(**context).strip() + "\n"
              Path(os.path.join(os.environ["WG_WORKDIR"], "wg0.conf")).write_text(rendered, encoding="utf-8")
              PY

              sudo install -d -m 700 /etc/wireguard
              sudo install -m 600 "$WG_WORKDIR/wg0.conf" /etc/wireguard/wg0.conf
            env:
              WG_WORKDIR: $(Agent.TempDirectory)/wireguard
              WIREGUARD_ADDRESS: $(WIREGUARD_ADDRESS)
              WIREGUARD_PRIVATE_KEY: $(WIREGUARD_PRIVATE_KEY)
              WIREGUARD_DNS: $(WIREGUARD_DNS)
              WIREGUARD_PEER_PUBLIC_KEY: $(WIREGUARD_PEER_PUBLIC_KEY)
              WIREGUARD_PRESHARED_KEY: $(WIREGUARD_PRESHARED_KEY)
              WIREGUARD_ENDPOINT: $(WIREGUARD_ENDPOINT)
              WIREGUARD_ALLOWED_IPS: $(WIREGUARD_ALLOWED_IPS)
              WIREGUARD_PERSISTENT_KEEPALIVE: $(WIREGUARD_PERSISTENT_KEEPALIVE)
            displayName: "Render WireGuard configuration"

          - bash: |
              set -euo pipefail

              echo "Starting WireGuard tunnel with wireguard-go..."
              sudo ip link delete dev wg0 2>/dev/null || true
              sudo WG_QUICK_USERSPACE_IMPLEMENTATION=wireguard-go wg-quick up wg0

              echo "Waiting for WireGuard interface..."
              for i in {1..30}; do
                if ip addr show wg0 > /dev/null 2>&1; then
                  echo "WireGuard interface is up after $i seconds"
                  ip addr show wg0
                  sudo wg show
                  exit 0
                fi
                sleep 1
              done

              echo "WireGuard interface did not come up within 30 seconds"
              exit 1
            displayName: "Connect via WireGuard"

          # Deploy step using SSH service connection (reused from backend)
          - task: SSH@0
            displayName: "Use SSH to connect to SMDV server"
            inputs:
              sshEndpoint: "smdv_searchpoint_app_server_ssh" # Name of the service connection
              runOptions: inline
              inline: |
                sed -i "s/^FRONTEND_TAG=.*/FRONTEND_TAG=$(VERSION_TAG)/" services/frontend/.env
                cd services/frontend && docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.ports.yml up -d --remove-orphans 2>&1

          - script: |
              sudo wg-quick down wg0 || sudo ip link delete dev wg0 || true
              sudo rm -f /etc/wireguard/wg0.conf
              rm -rf "$(Agent.TempDirectory)/wireguard"
            displayName: "Disconnect WireGuard"
            condition: always()

  - stage: "ReleaseToSinarmas"
    displayName: "Release to Sinarmas"
    dependsOn: BuildTest
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/'), not(endsWith(variables['Build.SourceBranch'], '-smdv')))
    variables:
      - group: scse-sinarmas-wireguard
    jobs:
      - job: DeployToSinarmas
        displayName: "Deploy to Sinarmas"
        pool:
          vmImage: ubuntu-latest
        steps:
          # Strip the 'v' prefix from the tag e.g. v1.0.0-sinarmas -> 1.0.0-sinarmas
          - bash: |
              TAG=$(Build.SourceBranchName)
              VERSION_TAG=${TAG#v}
              echo "##vso[task.setvariable variable=VERSION_TAG]$VERSION_TAG"
              echo "Original tag: $TAG"
              echo "Version tag: $VERSION_TAG"
            displayName: "Prepare version tag"

          # Update package.json version
          - script: |
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                pkg.version = '$(VERSION_TAG)';
                fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              "
            displayName: "Update package.json version for Sinarmas"

          # Build image
          # No build arguments needed here — the app has no NEXT_PUBLIC_* vars baked at build
          # time. Per-tenant config (APP_NAME, BACKEND_BASE_URL, AUTH_BASE_URL, UPDATER_BASE_URL)
          # is supplied purely at runtime via services/frontend/.env on the Sinarmas host.
          - task: Docker@2
            displayName: "Build Sinarmas docker image"
            inputs:
              containerRegistry: $(container_registry)
              command: "build"
              Dockerfile: "./Dockerfile"
              repository: "scse/search-ui-web"
              tags: |
                $(VERSION_TAG)

          # Push to ACR
          - task: Docker@2
            displayName: "Push Sinarmas docker image"
            inputs:
              containerRegistry: $(container_registry)
              command: "push"
              repository: "scse/search-ui-web"
              tags: |
                $(VERSION_TAG)

          - script: |
              sudo apt-get update
              sudo apt-get install -y wireguard-tools wireguard-go python3-jinja2
            displayName: "Install WireGuard dependencies"

          - bash: |
              set -euo pipefail

              WG_WORKDIR="$(Agent.TempDirectory)/wireguard"
              mkdir -p "$WG_WORKDIR"
              umask 077

              python3 - <<'PY'
              import os
              from pathlib import Path
              from textwrap import dedent
              from jinja2 import Template

              def wg_env(key, default=""):
                  val = os.environ.get(key, default)
                  if val.startswith("$(") and val.endswith(")"):
                      return default
                  return val

              context = {
                  "wireguard_address": os.environ["WIREGUARD_ADDRESS"],
                  "wireguard_private_key": os.environ["WIREGUARD_PRIVATE_KEY"],
                  "wireguard_dns": wg_env("WIREGUARD_DNS"),
                  "wireguard_peer_public_key": os.environ["WIREGUARD_PEER_PUBLIC_KEY"],
                  "wireguard_preshared_key": wg_env("WIREGUARD_PRESHARED_KEY"),
                  "wireguard_endpoint": os.environ["WIREGUARD_ENDPOINT"],
                  "wireguard_allowed_ips": wg_env("WIREGUARD_ALLOWED_IPS", "0.0.0.0/0"),
                  "wireguard_persistent_keepalive": wg_env("WIREGUARD_PERSISTENT_KEEPALIVE", "25"),
              }

              template = Template(dedent("""\
              [Interface]
              Address = {{ wireguard_address }}
              PrivateKey = {{ wireguard_private_key }}
              {% if wireguard_dns %}
              DNS = {{ wireguard_dns }}
              {% endif %}

              [Peer]
              PublicKey = {{ wireguard_peer_public_key }}
              {% if wireguard_preshared_key %}
              PresharedKey = {{ wireguard_preshared_key }}
              {% endif %}
              Endpoint = {{ wireguard_endpoint }}
              AllowedIPs = {{ wireguard_allowed_ips }}
              PersistentKeepalive = {{ wireguard_persistent_keepalive }}
              """))
              rendered = template.render(**context).strip() + "\n"
              Path(os.path.join(os.environ["WG_WORKDIR"], "wg0.conf")).write_text(rendered, encoding="utf-8")
              PY

              sudo install -d -m 700 /etc/wireguard
              sudo install -m 600 "$WG_WORKDIR/wg0.conf" /etc/wireguard/wg0.conf
            env:
              WG_WORKDIR: $(Agent.TempDirectory)/wireguard
              WIREGUARD_ADDRESS: $(WIREGUARD_ADDRESS)
              WIREGUARD_PRIVATE_KEY: $(WIREGUARD_PRIVATE_KEY)
              WIREGUARD_DNS: $(WIREGUARD_DNS)
              WIREGUARD_PEER_PUBLIC_KEY: $(WIREGUARD_PEER_PUBLIC_KEY)
              WIREGUARD_PRESHARED_KEY: $(WIREGUARD_PRESHARED_KEY)
              WIREGUARD_ENDPOINT: $(WIREGUARD_ENDPOINT)
              WIREGUARD_ALLOWED_IPS: $(WIREGUARD_ALLOWED_IPS)
              WIREGUARD_PERSISTENT_KEEPALIVE: $(WIREGUARD_PERSISTENT_KEEPALIVE)
            displayName: "Render WireGuard configuration"

          - bash: |
              set -euo pipefail

              echo "Starting WireGuard tunnel with wireguard-go..."
              sudo ip link delete dev wg0 2>/dev/null || true
              sudo WG_QUICK_USERSPACE_IMPLEMENTATION=wireguard-go wg-quick up wg0

              echo "Waiting for WireGuard interface..."
              for i in {1..30}; do
                if ip addr show wg0 > /dev/null 2>&1; then
                  echo "WireGuard interface is up after $i seconds"
                  ip addr show wg0
                  sudo wg show
                  exit 0
                fi
                sleep 1
              done

              echo "WireGuard interface did not come up within 30 seconds"
              exit 1
            displayName: "Connect via WireGuard"

          # Deploy step using SSH service connection (reused from backend)
          - task: SSH@0
            displayName: "Use SSH to connect to Sinarmas server"
            inputs:
              sshEndpoint: "sinarmas_searchpoint_app_server_ssh" # Name of the service connection
              runOptions: inline
              inline: |
                sed -i "s/^FRONTEND_TAG=.*/FRONTEND_TAG=$(VERSION_TAG)/" services/frontend/.env
                cd services/frontend && docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.ports.yml up -d --remove-orphans 2>&1

          - script: |
              sudo wg-quick down wg0 || sudo ip link delete dev wg0 || true
              sudo rm -f /etc/wireguard/wg0.conf
              rm -rf "$(Agent.TempDirectory)/wireguard"
            displayName: "Disconnect WireGuard"
            condition: always()

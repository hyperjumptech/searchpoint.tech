name: "SCSE Web"

variables:
  CI: true

pool:
  vmImage: "ubuntu-latest"

trigger:
  batch: "true"
  branches:
    include:
      - main
  tags:
    include:
      - "*"

stages:
  - stage: BuildTest
    displayName: Build and test
    jobs:
      - job: build_and_test
        displayName: Build and Test
        condition: always()
        timeoutInMinutes: "30"

        steps:
          - task: Npm@1
            displayName: Install Bun
            inputs:
              command: "custom"
              customCommand: "install -g bun"
              verbose: true

          - script: bun install
            displayName: "Install dependencies"

          - script: bun run lint
            displayName: "Run Static Code Analysis"

          # TODO: Enable tests when they are available
          # - script: bun test
          #   displayName: "Test the application"

          - script: bun run build
            displayName: "Build the application"
            env:
              APP_BASE_URL: $(APP_BASE_URL)
              BACKEND_BASE_URL: $(BACKEND_BASE_URL)

  - stage: "PushToACR"
    displayName: "Push to ACR"
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    jobs:
      - job: PushToACR
        displayName: "Push to ACR"
        steps:
          # Build and push Docker image
          # Needs separate step because build arguments are not supported in Docker@2 buildAndPush
          - task: Docker@2
            displayName: "Build docker image"
            inputs:
              containerRegistry: $(container_registry)
              command: "build"
              Dockerfile: "./Dockerfile"
              repository: "scse/search-ui-web"
              arguments: $(staging_build_arguments)
              tags: |
                $(Build.BuildId)-rc
                test

          - task: Docker@2
            displayName: "Push docker image"
            inputs:
              containerRegistry: $(container_registry)
              command: "push"
              repository: "scse/search-ui-web"
              tags: |
                $(Build.BuildId)-rc
                test

  - stage: "DeployToPoC"
    displayName: "Deploy to PoC"
    jobs:
      - job: DeployToPoC
        displayName: "Deploy to PoC"
        steps:
          # Deploy step using SSH service connection
          - task: SSH@0
            displayName: "Use SSH to connect to PoC server"
            inputs:
              sshEndpoint: "SSH to SCSE PoC" # Name of the service connection
              runOptions: inline
              inline: |
                export FRONTEND_TAG=$(Build.BuildId)-rc
                export BACKEND_TAG=$(bash /home/ubuntu/scripts/get-running.sh hyperjump.azurecr.io/scse/poc-backend)
                docker compose -f poc/compose.yaml up -d --remove-orphans 2>&1

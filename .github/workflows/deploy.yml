name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # No submodule init: the private mcp-contract repo is not needed for the
      # landing-only static build (see scripts/build-static.mjs).

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        env:
          # Serves at the domain root via CNAME below, so basePath stays empty.
          # Project-page fallback (no CNAME): set repo variable NEXT_BASE_PATH
          # to /<repo-name>.
          NEXT_BASE_PATH: ${{ vars.NEXT_BASE_PATH }}
          TENANT: ${{ vars.TENANT }}
        run: bun run build:static

      - name: Create CNAME file
        run: echo "searchpoint.tech" > out/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./out"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
